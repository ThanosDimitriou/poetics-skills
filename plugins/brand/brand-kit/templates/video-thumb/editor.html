<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Poetics video thumbnail</title>
<style>
/* Fonts load once, from the script below, for the canvas and this panel. */
:root { --paper:#EFF0EC; --deep:#E5E8E3; --shade:#C5CBC4; --ink:#121614; --soft:#5B625C; --lens:#16249C; --lens-deep:#0E1769; }
* { box-sizing: border-box; margin: 0; }
html, body { height: 100%; }
body { font: 15px/1.5 'Inter Tight', system-ui, sans-serif; background: var(--paper); color: var(--ink); display: flex; }
.panel { width: 380px; flex: none; padding: 28px 28px 40px; background: var(--deep); overflow-y: auto; }
h1 { font: 400 32px/1.1 'Instrument Serif', Georgia, serif; letter-spacing: -0.02em; }
.intro { color: var(--soft); margin: 8px 0 20px; font-size: 14px; }
label { display: block; font-size: 13px; color: var(--soft); margin: 16px 0 6px; }
select, input[type=text], textarea { width: 100%; font: inherit; color: var(--ink); background: var(--paper);
  border: 1px solid var(--soft); border-radius: 12px; padding: 9px 12px; }
textarea { min-height: 80px; resize: vertical; }
input[type=file] { font: inherit; font-size: 13px; }
.row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.btn { display: block; width: 100%; margin-top: 24px; min-height: 48px; border-radius: 9999px; border: 1px solid var(--lens);
  background: var(--lens); color: var(--paper); font: 500 15px 'Inter Tight', sans-serif; cursor: pointer; }
.btn:hover { background: var(--lens-deep); border-color: var(--lens-deep); }
.issues { margin-top: 18px; font-size: 13px; }
.issues p { color: var(--ink); padding: 8px 0; border-top: 1px solid var(--shade); }
.issues .ok { color: var(--soft); }
.stage { flex: 1; display: flex; align-items: center; justify-content: center; padding: 32px; min-width: 0; }
canvas { max-width: 100%; max-height: calc(100vh - 64px); width: auto; height: auto; border-radius: 4px;
  box-shadow: 0 2px 24px rgb(18 22 20 / 0.08); }
[hidden] { display: none !important; }
:focus-visible { outline: 2px solid var(--lens); outline-offset: 3px; }
</style>
</head>
<body>
<div class="panel">
  <h1>Video thumbnail.</h1>
  <p class="intro">1920×1080, for YouTube and video covers. People see it small: a few large words beat a sentence.</p>
  <div class="row">
    <div><label for="layout">Layout</label>
      <select id="layout"><option value="photo">Title and photo</option><option value="text">Title only</option></select></div>
    <div><label for="theme">Theme</label>
      <select id="theme"><option value="light">Light</option><option value="dark">Dark</option></select></div>
  </div>
  <label for="overline">Overline (optional)</label><input id="overline" type="text">
  <label for="title">Title</label><textarea id="title"></textarea>
  <label for="subtitle">Line under the title (optional)</label><input id="subtitle" type="text">
  <div data-for="photo"><label for="photo">Photograph</label><input id="photo" type="file" accept="image/*"></div>
  <div data-for="photo"><label for="focal">Keep in frame</label>
    <select id="focal"><option value="center">Center</option><option value="top">Top</option>
      <option value="bottom">Bottom</option><option value="left">Left</option><option value="right">Right</option></select></div>
  <button class="btn" id="export">Export PNG</button>
  <div class="issues" id="issues" aria-live="polite"></div>
</div>
<div class="stage"><canvas id="canvas" width="1920" height="1080" aria-label="Preview"></canvas></div>

// Shared drawing code for the Poetics social editors (social post, video thumbnail).
// The look is brand-kit/design-system.md: paper and ink, Instrument Serif for display, Inter Tight
// for text, photographs in apertures, hairlines, the wordmark. No gradients, no glows, no italics.
// build-social-editors.py inlines this file, the fonts and the wordmark into each editor.html.

const THEMES = {
  light: { paper: '#EFF0EC', deep: '#E5E8E3', shade: '#C5CBC4', ink: '#121614', soft: '#5B625C', lens: '#16249C' },
  dark:  { paper: '#121614', deep: '#1C211E', shade: '#3A423D', ink: '#F4F5F3', soft: '#8A918B', lens: '#8F9CFF' },
};
const DISPLAY = "'Instrument Serif', Georgia, serif";
const SANS = "'Inter Tight', 'Helvetica Neue', Arial, sans-serif";

// The wordmark, recoloured per theme (an SVG drawn as an image).
const wordmarks = {};
function wordmark(color) {
  if (!wordmarks[color]) {
    const img = new Image();
    img.src = 'data:image/svg+xml;base64,' + btoa(WORDMARK_SVG.replace('fill="#121614"', `fill="${color}"`));
    img.onload = () => window.render && window.render();
    wordmarks[color] = img;
  }
  return wordmarks[color];
}
function drawWordmark(ctx, color, x, y, h) {
  const img = wordmark(color);
  if (img.complete && img.naturalWidth) ctx.drawImage(img, x, y, h * 148 / 20, h);
}

// The wordmark's O, outer edge, as a 2px outline: decoration, used once (the closing band).
function drawRing(ctx, color, x, y, h) {
  const s = h / 20, ox = x - 20.068 * s;
  const P = (a, b) => [ox + a * s, y + b * s];
  ctx.save(); ctx.strokeStyle = color; ctx.lineWidth = 2; ctx.beginPath();
  ctx.moveTo(...P(30.102, 0)); ctx.lineTo(...P(46.825, 0));
  ctx.bezierCurveTo(...P(52.366, 0), ...P(56.859, 4.477), ...P(56.859, 10));
  ctx.bezierCurveTo(...P(56.859, 15.523), ...P(52.366, 20), ...P(46.825, 20));
  ctx.lineTo(...P(30.102, 20));
  ctx.bezierCurveTo(...P(24.56, 20), ...P(20.068, 15.523), ...P(20.068, 10));
  ctx.bezierCurveTo(...P(20.068, 4.477), ...P(24.56, 0), ...P(30.102, 0));
  ctx.stroke(); ctx.restore();
}

function roundRect(ctx, x, y, w, h, r) {
  const [tl, tr, br, bl] = Array.isArray(r) ? r : [r, r, r, r];
  ctx.beginPath();
  ctx.moveTo(x + tl, y); ctx.lineTo(x + w - tr, y); ctx.arcTo(x + w, y, x + w, y + tr, tr);
  ctx.lineTo(x + w, y + h - br); ctx.arcTo(x + w, y + h, x + w - br, y + h, br);
  ctx.lineTo(x + bl, y + h); ctx.arcTo(x, y + h, x, y + h - bl, bl);
  ctx.lineTo(x, y + tl); ctx.arcTo(x, y, x + tl, y, tl); ctx.closePath();
}

// A photograph in an aperture: cover-fit, cropped around the focal point. Empty -> a paper-deep frame.
const FOCAL = { center: [0.5, 0.5], top: [0.5, 0], bottom: [0.5, 1], left: [0, 0.5], right: [1, 0.5] };
function drawAperture(ctx, t, img, x, y, w, h, r, focal) {
  ctx.save(); roundRect(ctx, x, y, w, h, r); ctx.clip();
  ctx.fillStyle = t.deep; ctx.fillRect(x, y, w, h);
  if (img && img.naturalWidth) {
    const s = Math.max(w / img.naturalWidth, h / img.naturalHeight);
    const dw = img.naturalWidth * s, dh = img.naturalHeight * s;
    const [fx, fy] = FOCAL[focal] || FOCAL.center;
    ctx.drawImage(img, x - (dw - w) * fx, y - (dh - h) * fy, dw, dh);
  }
  ctx.restore();
}

// Greedy word wrap. Returns the lines.
function wrapLines(ctx, text, maxW) {
  const out = [];
  for (const para of String(text || '').split('\n')) {
    let line = '';
    for (const word of para.split(/\s+/).filter(Boolean)) {
      const test = line ? line + ' ' + word : word;
      if (ctx.measureText(test).width > maxW && line) { out.push(line); line = word; } else line = test;
    }
    out.push(line);
  }
  return out;
}

// The largest size from `sizes` at which the text fits in maxLines. Sets ctx.font.
function fit(ctx, text, family, weight, sizes, maxW, maxLines) {
  for (const size of sizes) {
    ctx.font = `${weight} ${size}px ${family}`;
    const lines = wrapLines(ctx, text, maxW);
    if (lines.length <= maxLines) return { size, lines };
  }
  const size = sizes[sizes.length - 1];
  ctx.font = `${weight} ${size}px ${family}`;
  return { size, lines: wrapLines(ctx, text, maxW).slice(0, maxLines), clipped: true };
}

// Draw lines with their first baseline at y. Returns the y below the last line.
function drawLines(ctx, lines, x, y, size, lh, color) {
  ctx.fillStyle = color; ctx.textBaseline = 'alphabetic';
  lines.forEach((l, i) => ctx.fillText(l, x, y + size * 0.82 + i * size * lh));
  return y + lines.length * size * lh;
}

function hairline(ctx, color, x, y, w) { ctx.fillStyle = color; ctx.fillRect(x, y, w, 2); }

// The copy check: the same rules as decks (guides/anti-slop.md), live in the editor.
const SLOP = ['journey', 'seamless', 'unforgettable', 'magical', 'magic', 'cutting-edge', 'revolutionary',
  'revolutionize', 'solution', 'leverage', 'unlock', 'next-generation', 'elevate', 'game-changing', 'delve',
  'empower', 'world-class', 'bespoke', 'hassle-free', 'step into', 'like never before', 'redefin',
  'reimagin', 'the future of', 'immerse yourself', 'dive into', 'ready when you are', "let's", 'shall we',
  'breathtaking', 'beyond imagination'];
function copyCheck(fields) {
  const issues = [];
  for (const [name, text] of Object.entries(fields)) {
    if (!text) continue;
    const low = text.toLowerCase();
    if (text.includes('—')) issues.push(`${name}: an em dash. Use a colon, comma or full stop.`);
    if (text.includes('!')) issues.push(`${name}: an exclamation mark.`);
    if (/\*[^*]+\*/.test(text)) issues.push(`${name}: *asterisks* (there are no italics). Remove them.`);
    if (/\b[A-Z]{4,}\b/.test(text.replace(/\b(VR|AR|XR|TIF|LBVR)\b/g, ''))) issues.push(`${name}: capitals. Use sentence case.`);
    if (/[\u{1F300}-\u{1FAFF}☀-➿]/u.test(text)) issues.push(`${name}: an emoji.`);
    const hit = SLOP.find(w => low.includes(w));
    if (hit) issues.push(`${name}: "${hit}" reads as stock copy. Say the plain fact.`);
  }
  return issues;
}

// Fonts: loaded from the embedded data, then the preview renders.
function loadFonts(faces) {
  return Promise.all(faces.map(([family, weight, url, range]) =>
    new FontFace(family, `url(${url})`, { weight: String(weight), unicodeRange: range }).load()
      .then(f => document.fonts.add(f)).catch(() => {})));
}

// The photo input: a local file, never uploaded.
function bindPhoto(inputId, onload) {
  const input = document.getElementById(inputId);
  const img = new Image();
  img.onload = () => onload(img);
  input.addEventListener('change', () => {
    const f = input.files && input.files[0];
    if (f) img.src = URL.createObjectURL(f);
  });
  return img;
}

function exportPNG(canvas, name) {
  const a = document.createElement('a');
  a.download = name;
  a.href = canvas.toDataURL('image/png');
  a.click();
}


const W = 1920, H = 1080, M = 120;
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const $ = id => document.getElementById(id);
let photo = null;
bindPhoto('photo', img => { photo = img; render(); });

function render() {
  const t = THEMES[$('theme').value];
  const layout = $('layout').value;
  document.querySelectorAll('[data-for]').forEach(el => el.hidden = el.dataset.for !== layout);
  ctx.fillStyle = t.paper; ctx.fillRect(0, 0, W, H);
  drawWordmark(ctx, t.ink, M, 108, 40);

  const over = $('overline').value.trim(), title = $('title').value.trim(), sub = $('subtitle').value.trim();
  const withPhoto = layout === 'photo';
  // A bleeding photograph runs off the right edge only, and that side is square.
  if (withPhoto) drawAperture(ctx, t, photo, 1056, 120, W - 1056, H - 240, [48, 0, 0, 48], $('focal').value);
  const textW = withPhoto ? 1056 - M - 72 : W - 2 * M;
  const tt = fit(ctx, title, DISPLAY, 400, withPhoto ? [150, 128, 110, 96] : [196, 168, 144, 120], textW, 3);
  ctx.font = `400 44px ${SANS}`;
  const subLines = sub ? wrapLines(ctx, sub, textW).slice(0, 2) : [];
  const blockH = (over ? 72 : 0) + tt.lines.length * tt.size * 1.02 + (subLines.length ? 40 + subLines.length * 44 * 1.4 : 0);
  let y = H - 120 - blockH;
  if (over) { ctx.font = `400 34px ${SANS}`; drawLines(ctx, [over], M, y, 34, 1.4, t.soft); y += 72; }
  ctx.font = `400 ${tt.size}px ${DISPLAY}`;
  y = drawLines(ctx, tt.lines, M, y, tt.size, 1.02, t.ink);
  if (subLines.length) { ctx.font = `400 44px ${SANS}`; drawLines(ctx, subLines, M, y + 40, 44, 1.4, t.soft); }

  const issues = copyCheck({ Overline: over, Title: title, Line: sub });
  if (title.split(/\s+/).filter(Boolean).length > 8) issues.push('Title: more than eight words. Thumbnails are seen small.');
  $('issues').innerHTML = issues.length ? issues.map(i => `<p>${i.replace(/</g, '&lt;')}</p>`).join('')
                                        : '<p class="ok">Copy check: nothing to fix.</p>';
}
window.render = render;

document.querySelectorAll('input, select, textarea').forEach(el => el.addEventListener('input', render));
$('export').addEventListener('click', () => { render(); exportPNG(canvas, 'poetics-video-thumbnail.png'); });

$('title').value = 'Inside a pop-up VR cinema.';
loadFonts(FONT_FACES).then(render);
render();
</script>
</body>
